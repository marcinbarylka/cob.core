[project]
name = "citadel_of_blood"
version = "0.1.0"
description = ""
authors = [
    {name = "Marcin Baryłka", email = "marcin.barylka@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "pygame>=2.6.1,<3.0.0",
    "pydantic>=2.10.6,<3.0.0",
    "toml>=0.10.2,<1.0.0",
    "platformdirs>=4.3.6,<5.0.0",
    "nanoid>=2.0.0,<3.0.0",
    "pillow>=11.2.1,<12.0.0"
]

[dependency-groups]
dev = [
    "isort>=5.13.2,<6.0.0",
    "ruff>=0.5.3,<1.0.0",
    "pytest>=8.3.2,<9.0.0",
    "ipython>=9.0.1,<10.0.0",
    "pre-commit>=4.1.0,<5.0.0",
    "pyment>=0.3.3,<1.0.0",
    "mypy>=1.16.0,<2.0.0"
]

[tool.uv]
default-groups = []

[tool.ruff]
line-length = 120
exclude = [
    ".bzr", ".direnv", ".eggs", ".git", ".git-rewrite", ".hg", ".ipynb_checkpoints", ".mypy_cache", ".nox", ".pants.d",
    ".pyenv", ".pytest_cache", ".pytype", ".ruff_cache", ".svn", ".tox", ".venv", ".vscode", "__pypackages__", "_build",
    "buck-out", "build", "dist", "node_modules", "site-packages", "venv", "migrations", "static", "templates", "media",
    "logs", "tmp", "var", "manage.py", "tests", "tests.py"
]

[tool.ruff.format]
docstring-code-format = false
quote-style = "double"

[tool.ruff.lint]
select = [
    "C4", "D", "E", "F", "I", "N", "PGH", "PTH", "Q", "SIM"
]
ignore = [
    "D203",  # incorrect-blank-line-before-class
    "D213"   # multi-line-summary-second-line
]
